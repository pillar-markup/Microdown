name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 2.7.0 or v2.7.0). The tag must exist.'
        required: true
        type: string
      project-file:
        description: 'Location of the Pharo project metadata file (.project).'
        required: false
        default: .project
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: guillep/pharo-release@v4
        with:
          tag: ${{ inputs.tag }}
          # Tag pushes have no workflow_dispatch inputs, so preserve the action default.
          project-file: ${{ inputs.project-file || '.project' }}
